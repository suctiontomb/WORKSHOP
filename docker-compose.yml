version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: workshop
      POSTGRES_USER: workshop_user
      POSTGRES_PASSWORD: workshop123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - workshop_network
  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://workshop_user:workshop123@db:5432/workshop
    networks:
      - workshop_network
networks:
  workshop_network:

volumes:
  postgres_data:










